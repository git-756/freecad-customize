[project]
name = "freecad-customize"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
target-version = "py311"
lint.select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["Mod/Customize"]
testpaths = ["tests"]
